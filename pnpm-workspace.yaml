packages:
  - 'packages/*'

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  # optional native accelerators for ssh2 (via @google/adk 2.x -> dockerode); pure-JS fallback is used
  cpu-features: false
  ssh2: false

overrides:
  # single-major packages — one floor per package (replaces multi-entry ladders)
  protobufjs: ">=7.5.5"
  tar: ">=7.5.21"
  postcss: ">=8.5.18"
  langsmith: ">=0.6.0"
  fast-uri: ">=3.1.9 <4.0.0"
  fast-xml-parser: ">=5.7.0"
  fast-xml-builder: ">=1.1.7"
  hono: ">=4.13.11 <5.0.0"
  "@hono/node-server": ">=2.0.5"
  ip-address: ">=10.7.4 <11.0.0"
  qs: ">=6.16.0 <7.0.0"
  esbuild: ">=0.28.1"
  "@opentelemetry/core": ">=2.8.0"
  js-yaml: ">=4.3.2 <5.0.0"
  proxy-addr: ">=2.0.8 <3.0.0"
  handlebars: ">=4.7.10 <5.0.0"
  source-map-js: ">=1.2.2 <2.0.0"
  fast-copy: ">=3.1.0 <4.0.0"
  pbkdf2: ">=3.1.7 <4.0.0"
  "@humanfs/node": ">=0.16.8 <0.17.0"
  "@modelcontextprotocol/sdk": ">=1.32.2 <2.0.0"

  # range-scoped — bare floor would pull across a major boundary
  "vite@>=7.0.0 <=7.3.4": ">=7.3.5 <8.0.0"
  "ws@>=8.0.0 <8.21.0": ">=8.21.0"
  "uuid@<11.1.1": ">=11.1.1 <13.0.0"
  "@elizaos/core>uuid": ">=13.0.2"
  "@langchain/langgraph-sdk>uuid": ">=13.0.2"
  "brace-expansion@<1.1.16": ">=1.1.16 <2.0.0"
  "brace-expansion@>=2.0.0 <2.1.2": ">=2.1.2 <3.0.0"
  "brace-expansion@>=5.0.0 <5.0.12": ">=5.0.12 <6.0.0"
  "body-parser@<1.20.9": ">=1.20.9 <2.0.0"
  "body-parser@>=2.0.0 <2.4.0": ">=2.4.0 <3.0.0"
  "@grpc/grpc-js@<1.13.6": ">=1.13.6 <1.14.0"
  "@grpc/grpc-js@>=1.14.0 <1.14.5": ">=1.14.5 <2.0.0"
  "nanoid@<3.3.18": ">=3.3.18 <4.0.0"
  # crosses 5 -> 6; @elizaos/core 1.7.2 declares ^5.2.133 but never imports it
  "@elizaos/core>pdfjs-dist": ">=6.2.108 <7.0.0"
