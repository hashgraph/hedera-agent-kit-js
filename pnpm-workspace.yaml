packages:
  - 'packages/*'

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  sqlite3: true

overrides:
  # single-major packages — one floor per package (replaces multi-entry ladders)
  protobufjs: ">=7.5.5"
  tar: ">=7.5.21"
  postcss: ">=8.5.18"
  langsmith: ">=0.6.0"
  fast-uri: ">=3.1.4"
  fast-xml-parser: ">=5.7.0"
  fast-xml-builder: ">=1.1.7"
  hono: ">=4.12.27"
  "@hono/node-server": ">=2.0.5"
  ip-address: ">=10.1.1"
  "@tootallnate/once": ">=2.0.1"
  qs: ">=6.15.2"
  "@mikro-orm/knex": ">=6.6.14"
  esbuild: ">=0.28.1"
  "@opentelemetry/core": ">=2.8.0"
  undici: ">=6.27.0"
  adm-zip: ">=0.6.0"
  js-yaml: ">=4.1.0"
  form-data: ">=2.5.6"

  # range-scoped — bare floor would pull across a major boundary
  "vite@>=7.0.0 <=7.3.4": ">=7.3.5"
  "ws@>=8.0.0 <8.21.0": ">=8.21.0"
  "uuid@<11.1.1": ">=11.1.1 <13.0.0"
  "@elizaos/core>uuid": ">=13.0.2"
  "@langchain/langgraph-sdk>uuid": ">=13.0.2"
  "brace-expansion@<1.1.16": ">=1.1.16 <2.0.0"
  "brace-expansion@>=2.0.0 <2.1.2": ">=2.1.2 <3.0.0"
  "brace-expansion@>=5.0.0 <=5.0.7": ">=5.0.8"
  "body-parser@<1.20.6": ">=1.20.6"
  "body-parser@>=2.0.0 <2.3.0": ">=2.3.0"
